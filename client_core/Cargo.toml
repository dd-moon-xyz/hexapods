[package]
name = "client-core"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Shared SDL viewer, streaming, recording, and replay for Hexapods clients"

[dependencies]
anyhow = "1"
tempfile = "3"
ctrlc = "3"
sdl3 = "0.22.1"
serde_json = "1"
turbojpeg = "1.5.1"
tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }
ureq = { version = "3.5.1", default-features = false, features = ["rustls"] }
url = "2"

[features]
bundled-sdl = ["sdl3/build-from-source-static"]

