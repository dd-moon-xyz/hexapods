[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hexapods-local-client"
version = "0.1.0"
description = "Windowed hexapod viewer for local testing and keyboard control"
requires-python = ">=3.14,<3.15"
dependencies = [
    "pygame-ce==2.5.8",
    "websockets==17.2",
]

[project.scripts]
local-client = "local_client.client:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.uv]
python-preference = "only-managed"

[tool.setuptools.packages.find]
where = ["src"]
include = ["local_client*"]
