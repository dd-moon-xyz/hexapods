[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "hexapods-client-core"
version = "0.1.0"
requires-python = ">=3.14,<3.15"
dependencies = ["pygame-ce==2.5.8", "websockets==17.4", "tqdm==4.70.1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
client_core = ["assets/*.zip"]
