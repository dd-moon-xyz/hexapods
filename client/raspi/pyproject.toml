[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "hexapods-client"
version = "0.1.0"
requires-python = ">=3.14,<3.15"
dependencies = ["hexapods-client-core", "pydantic-settings==2.16.2"]

[project.scripts]
hexapods-client = "hexapods_client.client:main"
hexapods-replay = "client_core.replay:main"
hexapods-collect = "client_core.collect:main"
hexapods-preview = "hexapods_client.client:preview"

[tool.uv]
python-preference = "only-managed"

[tool.uv.sources]
hexapods-client-core = { path = "../core", editable = true }

[tool.setuptools.packages.find]
where = ["src"]
include = ["hexapods_client*"]

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "pytest-xdist==3.8.0",
]
