name: Compilation

on:
  push:

permissions:
  contents: read

jobs:
  compilation:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: server/native
    steps:
      - uses: actions/checkout@v7

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential gcc-11 g++-11 cmake pkg-config \
            nvidia-cuda-toolkit

      - name: Configure
        run: >-
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          -DBUILD_TESTING=ON
          -DCMAKE_C_COMPILER=gcc-11
          -DCMAKE_CXX_COMPILER=g++-11
          -DCMAKE_CUDA_HOST_COMPILER=g++-11

      - name: Run compilation test
        run: ctest --test-dir build -R '^compilation$' --output-on-failure --no-tests=error
