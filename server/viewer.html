<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hexapod stream</title>
<style>
body { background: #171717; color: #eee; font: 16px sans-serif; max-width: 760px; margin: 24px auto; padding: 0 16px; }
textarea { width: 100%; height: 200px; box-sizing: border-box; }
canvas { width: 100%; background: black; }
button, select { margin: 8px 8px 8px 0; padding: 8px; }
</style>
<h1>Hexapod stream</h1>
<form id="login"><input id="token" type="password" placeholder="Client API token" aria-label="Client API token" autocomplete="off"><button>Sign in</button></form>
<textarea id="config" aria-label="Simulation configuration"></textarea>
<button id="start">Start / restart</button><button id="pause">Pause</button><button id="stop">Stop</button>
<p id="status">Ready</p>
<canvas id="canvas" width="512" height="512"></canvas>
<script>
const config = document.querySelector('#config');
const status = document.querySelector('#status');
const canvas = document.querySelector('#canvas');
const context = canvas.getContext('2d');
function loadPreset() {
fetch('/preset').then(response => { if (!response.ok) throw new Error('Sign in to load the preset'); return response.json(); }).then(data => {
  config.value = JSON.stringify(data, null, 2);
}).catch(error => status.textContent = error.message);
}
loadPreset();
document.querySelector('#login').onsubmit = async event => {
  event.preventDefault();
  const input = document.querySelector('#token');
  try {
    const response = await fetch('/login', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({token: input.value})});
    input.value = '';
    if (!response.ok) throw new Error('Sign in failed');
    status.textContent = 'Signed in';
    loadPreset();
  } catch (error) { status.textContent = error.message; }
};
let socket, paused = false, pending = false, circular = false;
const heldKeys = new Map();
function requestFrame() {
  if (socket?.readyState === WebSocket.OPEN && !paused && !pending) {
    pending = true;
    socket.send('next');
  }
}
document.querySelector('#start').onclick = () => {
  let data;
  try { data = JSON.parse(config.value); } catch (error) { status.textContent = error.message; return; }
  if (socket && socket.readyState !== WebSocket.CLOSED) {
    const previous = socket;
    previous.onclose = () => { if (socket === previous) { socket = null; document.querySelector('#start').click(); } };
    previous.close();
    return;
  }
  paused = false; pending = false;
  document.querySelector('#pause').textContent = 'Pause';
  const connection = new WebSocket(`${location.protocol === 'https:' ? 'wss' : 'ws'}://${location.host}/ws`);
  socket = connection;
  circular = data.boundary === 'circle';
  connection.binaryType = 'blob';
  status.textContent = 'Starting…';
  connection.onopen = () => connection.send(JSON.stringify(data));
  connection.onmessage = async event => {
    if (connection !== socket) return;
    if (typeof event.data === 'string') {
      const message = JSON.parse(event.data);
      status.textContent = message.error || message.status;
      if (message.status === 'started') {
        canvas.width = canvas.height = message.size;
        requestFrame();
      }
      return;
    }
    try {
      const bitmap = await createImageBitmap(event.data);
      context.drawImage(bitmap, 0, 0);
      bitmap.close();
      pending = false;
      requestFrame();
    } catch (error) { status.textContent = error.message; connection.close(); }
  };
  connection.onerror = () => status.textContent = 'Connection failed';
  connection.onclose = () => { if (status.textContent === 'started') status.textContent = 'Disconnected'; };
};
document.querySelector('#pause').onclick = event => {
  paused = !paused;
  event.target.textContent = paused ? 'Resume' : 'Pause';
  if (!paused) requestFrame();
};
document.querySelector('#stop').onclick = () => { socket?.close(); status.textContent = 'Stopped'; };
function steer() {
  if (socket?.readyState === WebSocket.OPEN && circular) socket.send([...heldKeys.values()].at(-1) ?? 'inward');
}
document.addEventListener('keydown', event => {
  if (!['Space', 'KeyC', 'KeyV'].includes(event.code) || event.repeat || ['TEXTAREA', 'INPUT', 'SELECT', 'BUTTON'].includes(event.target.tagName)) return;
  if (socket?.readyState === WebSocket.OPEN && circular) {
    event.preventDefault();
    heldKeys.set(event.code, event.code === 'KeyV' ? 'inward_fast' : 'outward');
    steer();
  }
});
document.addEventListener('keyup', event => {
  if (heldKeys.has(event.code)) {
    event.preventDefault();
    heldKeys.delete(event.code);
    steer();
  }
});
window.addEventListener('blur', () => { if (heldKeys.size) { heldKeys.clear(); steer(); } });
</script>
</html>
