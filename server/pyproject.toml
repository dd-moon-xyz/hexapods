[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "lenia-stream"
version = "0.1.0"
requires-python = ">=3.14,<3.15"
dependencies = [
    "fastapi==0.142.2",
    "pillow==12.3.0",
    "pydantic==2.13.5",
    "uvicorn==0.54.0",
    "websockets==17.2",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["lenia*"]

[tool.setuptools.package-data]
"lenia.server" = ["viewer.html"]
