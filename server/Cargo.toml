[package]
name = "server"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Unpaced Rust HTTP/WebSocket server for the CUDA Hexapods worker"

[dependencies]
anyhow = "1"
axum = { version = "0.8.9", features = ["ws"] }
rand = "0.10.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1.54.1", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
turbojpeg = "1.5.1"
tokio-tungstenite = "0.29"

[dev-dependencies]
futures-util = { version = "0.3", features = ["sink"] }
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
